name: sync schema and vocabularies
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: loopledger/loopledger
          path: .src
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: node scripts/build.mjs .src
      - name: Commit and rebuild Pages if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add schema ns vocab
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "site: sync schema and vocabularies from loopledger/loopledger@$(git -C .src rev-parse --short HEAD)"
          git push
          # A push made with GITHUB_TOKEN may not start a Pages build on its own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
